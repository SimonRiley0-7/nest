name: nest_estate_technology
description: "NEST - Next Generation Estate Technology cross-platform mobile marketplace application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  http: ^1.1.2
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  carousel_slider: ^4.2.1
  google_fonts: ^6.1.0
  url_launcher: ^6.2.2
  image_picker: ^1.2.4
  flutter_svg: ^2.0.9
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/docs/
